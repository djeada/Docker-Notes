services:
  flask:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
